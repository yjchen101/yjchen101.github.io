{% if site.comments.waline.server_url != empty and site.comments.waline.server_url %}
  <link rel="stylesheet" href="https://unpkg.com/@waline/client@3.16.2/dist/waline.css">
  <script type="module">
    import { init } from 'https://unpkg.com/@waline/client@3.16.2/dist/waline.js';

    const container = document.createElement('section');
    container.id = 'waline';
    container.className = 'mt-5 mb-5';
    container.setAttribute('aria-label', '评论区');
    document.querySelector('#tail-wrapper > footer').before(container);

    const waline = init({
      el: container,
      serverURL: {{ site.comments.waline.server_url | jsonify }},
      path: {{ page.url | relative_url | jsonify }},
      lang: 'zh-CN',
      login: 'disable',
      meta: ['nick', 'mail'],
      requiredMeta: ['nick'],
      dark: Theme.visualState === Theme.DARK,
      locale: { placeholder: '欢迎留言交流，昵称必填，邮箱选填。' }
    });

    window.addEventListener('message', (event) => {
      if (event.source === window && event.data && event.data.id === Theme.ID) {
        waline.update({ dark: Theme.visualState === Theme.DARK });
      }
    });
  </script>
{% endif %}
